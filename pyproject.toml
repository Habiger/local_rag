[project]
name = "local-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "docling==2.85.0",
    "docling-core==2.72.0",
    "docling-hierarchical-pdf>=0.1.8",
    "docling-ibm-models==3.13.0",
    "docling-jobkit==1.16.0",
    "docling-mcp==1.3.4",
    "docling-parse==5.8.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.3",
    "llama-index>=0.14.21",
    "llama-index-llms-llama-cpp>=0.6.0",
    "llama-index-llms-openai>=0.7.8",
    "llama-index-retrievers-bm25>=0.7.1",
    "llama-index-vector-stores-postgres>=0.8.1",
    "openai>=2.36.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.90.0",
    "pypdf>=6.10.2",
    "sqlalchemy[asyncio]>=2.0.49",
    "tenacity>=9.1.4",
    "transformers>=5.6.2",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
